# Each pins a specific producer lowering path. A regression in the
# producer's emit changes the locked sha and trips the corpus gate.
# Different fixtures may share an emitted-byte sha when distinct
# scan-time paths converge on the same final emit; the behavior_class
# field disambiguates.
# ===========================================================================

