# Phosphoric fixture manifest — razor-gated metadata.
#
# Every entry must satisfy the doctrine in docs/FIXTURE_RAZOR.md:
#   - behavior_class    (what producer path / behavior is being pinned)
#   - ambiguity_removed (the specific ambiguity this fixture eliminates)
#   - at least one of the four required_for_* doctrine flags = true
#
# A fixture exists only if it eliminates one of:
#   1. compiler closure          → required_for_self_host
#   2. task-seal closure          → required_for_task_seal
#   3. residual truth             → required_for_residual_truth
#   4. forensic classification   → required_for_forensic_classification
#
# Duplicate behavior_class values must carry a justified_duplicate
# field explaining why both fixtures earn their place.
#
# This file is authoritative. tools/verify/fixture_corpus.sh reads it
# instead of scanning the fixtures dir; tools/verify/check_fixture_razor.sh
# enforces the doctrine on every entry.

# ===========================================================================
# Compiler / bootstrap fixtures (doctrine goal #1: compiler closure).
