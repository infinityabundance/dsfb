# ---------------------------------------------------------------------------
# Allowed fetch hosts.
# fetch_and_hash_stage0.phos rejects any binary_url not under one of these.
# ---------------------------------------------------------------------------
[fetch]
allowed_url_schemes = ["https"]
allowed_hosts = [
    # Populate with the project's release host. Empty by default;
    # bootstrap fetch fails closed until at least one host is listed.
]

# ---------------------------------------------------------------------------
# Fixpoint policy.
# ---------------------------------------------------------------------------
[fixpoint]
required_convergence_stage  = 3   # stage 3 must equal stage 2 byte-for-byte
allow_stage1_to_differ_from_stage2 = true  # only when stage 0 was used to build stage 1
fail_closed                 = true

# ---------------------------------------------------------------------------
# Cache policy.
# ---------------------------------------------------------------------------
[cache]
cache_path             = ".cache/bootstrap"
cache_clear_on_mismatch = true
record_provenance      = true

# ---------------------------------------------------------------------------
# Reproduction policy. Documents the contract attesters follow per
# bootstrap/STAGE0_BUILD.md.
#
# Each named field has a single-source-of-truth: this manifest. Updates to
# any field in this section are append-only via a `superseded_by` pointer
# pattern, mirroring the [[stage0]] entry discipline.
# ---------------------------------------------------------------------------
[reproduction]
runbook_path                  = "bootstrap/STAGE0_BUILD.md"
deterministic_build_flags     = "single-codegen-unit, full-LTO, symbols-stripped"
required_target_triple        = "x86_64-unknown-linux-gnu"
attestation_signature_format  = "GPG detached, ASCII-armored over the binary's SHA-256 hex"

# Operationally-verifiable runbook fields. A community attester can
# machine-read these before reading the full STAGE0_BUILD.md prose.
sha256_command                 = "sha256sum"
attestation_command            = "gpg --detach-sign --armor"
expected_binary_basename       = "pcc-stage0.bin"
expected_binary_size_min_bytes = 524288         # 512 KiB lower bound; below this is suspect
expected_binary_size_max_bytes = 16777216       # 16 MiB upper bound; above this is suspect
attestation_filename_pattern   = "<binary_sha256>.sha256.asc"
