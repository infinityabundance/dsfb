# Phosphoric bootstrap chain manifest.
#
# This file pins the stage 0 bootstrap binary by URL and SHA-256.
# The narrative is in STAGE0.md. Phase 0 (the active doctrine
# replacement for the historical externally-built stage 0) is in
# phase0/; its source is phase0/phase0_compiler.phos and its subset
# spec is phase0/phase0_subset.md. External attesters follow
# phase0/HANDBOOTSTRAP.md to produce the binary recorded in
# [[stage0]] entries below.
#
# Stage 0 is invoked exactly once at first-build to produce stage 1 from pcc.phos.
# From stage 1 onward the chain is self-perpetuating; verify_fixpoint.phos
# asserts byte-equality from stage 2 to stage 3.
#
# This file is APPEND-ONLY for stage entries. An existing entry is never
# rewritten; if it is superseded, it gets a `superseded_by` field and a new
# entry is added below it. Attestations may be appended to an existing entry.

manifest_version = "phosphoric-bootstrap-v1"
canonical_compiler_source = "compiler/pcc.phos"

# Default stage to use when not otherwise specified. The active doctrine
# path is phase 0 (Phosphoric-source bootstrap built once by attesters
# with hand-coded x86_64 ASM stubs); the historical externally-built
# entry remains as superseded record.
default_stage0 = "phase0-x86_64-linux-2026-04"

