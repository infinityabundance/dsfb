note          = "scaffold attestation - self-signed; Records SOUNDNESS FIX for M.3.V and M.3.X: both originally landed without a depth gate, causing them to fire on INNER matches in nested-match fns. Discovery: `is_ws { match b == 32 { ... false => match b == 9 { ... false => match b == 10 { true => true, false => b == 13 } ... } } }` — innermost match matches M.3.X's pattern exactly. Without a depth gate, M.3.X fires on the innermost match and sets the match-cmp + M.3.X flags. The OUTER fn emit then uses M.3.X's leaf-style block which contains ONLY the innermost match's logic, miscompiling is_ws to rc=0 for b=32 (semantically true). Same gap existed in M.3.V's earlier landing (would have miscompiled is_alpha similarly). **Fix**: at the top of each M.3.V and M.3.X scan-time detection, add `cmp r8, 1; jne skip` — only fire for top-level match in fn body (depth=1). Verified post-fix: is_ws-style nested match falls through to default (rc=name_pool fallback, honest non-support); non-nested cases still work. **Phase-0 hash CHANGED** from 0742b4961e513155f594e9c3848bc50337b503335e25bdd1d68c418fb5f0de0e (M.3.X-with-soundness-bug state) to 5bcb507c5ad3b1644c09168724baf925579f9eb4805ba377e311df12a1afe37a (corrected state). Pre-fix M.3.V/M.3.X hash advances were partially fictitious — they reflected miscompiled is_alpha/is_ws emissions, not real chain progress. Post-fix: is_digit is the only is_*-family fn correctly lowered (via M.3.V); is_alpha and is_ws await M.3.Y nested-match support. Pre-existing 64 fixture corpus stays byte-equal. **Lesson recorded**: when adding a new match-pattern recognizer, gate on body-scan depth — nested matches share token shapes with simple matches and silently miscompile if the gate is missing."

