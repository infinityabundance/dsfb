# GNU `as` + linked with GNU `ld -static -nostdlib` (no libc, no
# external runtime). The stub is the doctrine-prescribed bootstrap
# runtime mechanism; it is transient - once stage 1 (pcc.phos compiled
# by stage 0) can produce a stage-0-equivalent binary directly from
# Phosphoric source, this ASM is retired.
