note          = "scaffold attestation - self-signed; Records M.3.S-safety: a soundness gap was discovered in M.3.S after M.3.T-safe was landed. The original M.3.S fired unconditionally for `IDENT ( INNER ) }` at depth=1 — but this miscompiled `caller { helper(7) }` (bare-form fn call) as if helper were a constructor, emitting `mov eax, 7; ret` instead of calling helper. The discovery method was a manual audit: testing `caller { helper(7) }` where helper ignores its arg and returns 99 — semantic rc=99, but actual rc=7 (M.3.S captured the inner INT). Fix: gate M.3.S on fn_offset_table lookup at the very top of the bare-form check (same approach as M.3.T-safe). On 'is fn' match, restore r9 and rdi via push/pop and jump to .Lefc_h_check_kw_after_constructor (the fn call dispatch will handle it if shape matches; otherwise falls through to default). On 'not fn', proceed with M.3.S constructor checks. Verified: 61 fixtures stay byte-equal; the bare-fn-call regression test now produces rc=33 (default name_pool fallback — honest non-support) instead of the prior wrong-bytes rc=7. **Phase-0 hash UNCHANGED** at 5bcb507c5ad3b1644c09168724baf925579f9eb4805ba377e311df12a1afe37a because phase0_compiler.phos doesn't use bare-form fn calls. The fix is defensive — preserves constructor lowering while closing the bare-fn-call miscompile. **Lesson recorded**: when adding a token-shape pattern that's ambiguous with another, gate on existing producer state queries (here: fn_offset_table) — same pattern as M.3.T-safe."

