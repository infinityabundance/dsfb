compiler_id      = "phase0_stub.S (hand-coded x86_64 Linux ASM; transient bootstrap runtime)"
compiler_version = "phase0_stub.S@2026-04-29 Pass C+D+E+G++H+J+K+L + phase0_compiler.phos@2026-04-29 Pass G + Pass O.1. Producer (ASM) passes: lex (C), duplicate-name reject (D), fn count (E), per-fn distinguishable codegen via name_pool_idx (G+: 16-byte block per fn keyed on the interned name index), real `return INTLIT;` lowering (H, 2026-04-29): emit_per_fn_codes does a forward token-buffer scan within each fn body for the `return INTLIT ;` pattern, lowering entry fn to `mov rax,60 / mov rdi,IMM32 / syscall` and non-entry fn to `push rbp / mov rbp,rsp / mov eax,IMM32 / mov rsp,rbp / pop rbp / ret`. Pass J (2026-04-29): identifier interning in lex_ident_or_keyword. An ident_table at .bss records (offset, length) per UNIQUE identifier seen; before appending a new ident's bytes to name_pool, the lexer walks ident_table and reuses an existing offset on byte-equality match. The TK_IDENT payload is now a real interned name index — two occurrences of the same source string carry equal payload. Pass K (2026-04-29, blocked-on-J before this revision): real `let IDENT = INTLIT ; … return IDENT ;` lowering. emit_per_fn_codes scan recognises the let pattern (`let IDENT = INTLIT ;`, no mut, no type ann), saves (let_name_offset, let_value) to per-fn stack slots [rbp-32]/[rbp-28], and on a subsequent `return IDENT ;` matches the IDENT payload against the saved offset (Pass J's interning makes this a real name match), capturing the let value as the lowered immediate. The scan is non-recursive (walks tokens with a local depth counter in r8). emit_per_fn_codes uses callee-saved registers + stack scratch (rbx/r12-r15 + [rbp-8] depth + [rbp-24] 16-byte block buffer + [rbp-32]/[rbp-28] let-tracking) after the r10/r11 syscall-clobber bug. Source (Phos): real function-body parsing — let / return / expr-stmt / for-with-bound. Determinism verified: three consecutive runs produce byte-identical output for both phase0/phase0_compiler.phos (04f4c4fd…, 952 B; was a71f8b0d… pre-Pass-J before interning collapsed duplicate name_pool entries) and synthetic test sources. Pass H+K verified end-to-end on six synthetic sources: `return 42;` → exit 42; `let x = 7; return x;` → exit 7; `let alpha = 9; return alpha;` → exit 9; `let y = 99; return 5;` → exit 5 (Pass H wins over let); `let x = 7; return q;` → exit 0 (no name match → fallback); `main let x = 42; return x;` plus `helper let q = 17; return q;` → exit 42 with helper non-entry block carrying mov eax,17. Pass L (2026-04-29): constant-folding lowering for `return A op B ;` where A is INTLIT or matched-let IDENT and B is INTLIT, op in {+ - * /}. The producer scan extends the return peek to look at +2 (PUNCT op tag 22/23/24/25), +3 (TK_INT operand_b), +4 (PUNCT `;`); if matched, edx receives op(A, B) computed at producer-time (signed 32-bit; idiv for division; divide-by-zero falls back to capturing operand_a alone). Block size unchanged (16 B); ELF header layout unchanged; phase-0 hash for phase0_compiler.phos UNCHANGED at 04f4c4fd… because no top-level fn uses binary expressions. Verified end-to-end on six synthetic sources: 5+7→12, 50-8→42, 6*7→42, 100/2→50, let x=10; return x+32 → 42, return 5/0 → 5 (divide-by-zero fallback to operand_a). Frame extended from 32 B to 48 B for two new stack slots ([rbp-36] op_tag, [rbp-40] operand_b) needed across +3/+4 peeks. Determinism preserved (3 runs of each input byte-identical). Next concrete deliverable (Pass M): bounded `for` loops with #[bound=N]."
