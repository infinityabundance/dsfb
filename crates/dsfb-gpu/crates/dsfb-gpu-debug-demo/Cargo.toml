[package]
name        = "dsfb-gpu-debug-demo"
version     = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
repository.workspace   = true
keywords.workspace     = true
readme = "README.md"
description = "CLI binary for dsfb-gpu-debug: generate fixtures, run CPU/GPU pipelines, compare case files."

[[bin]]
name = "dsfb-gpu-debug"
path = "src/main.rs"

[features]
default = []
# Forwards the `cuda` feature to the kernel crate. Without it, `run-gpu`
# exits with code 2 and the message "GPU unavailable".
cuda    = ["dsfb-gpu-debug-cuda/cuda"]

[dependencies]
dsfb-gpu-debug-core = { version = "0.1.0", path = "../dsfb-gpu-debug-core", features = ["std", "demo"] }
dsfb-gpu-debug-cuda = { version = "0.1.0", path = "../dsfb-gpu-debug-cuda" }

[lints]
workspace = true
