# DSFB-GPU-Debug — Artifact Manifest v1
#
# Machine-readable index of every sealed artifact in the prior-art
# evidence package. Each entry records an artifact locator (crate-relative
# path for in-repository files; external-archive locator for archived
# bytes), the file's SHA-256 (lowercase hex), the artifact kind, optional
# availability, and a one-line role description.
#
# The companion test
# `crates/dsfb-gpu-debug-demo/tests/pa_1_prior_art_evidence_invariants.rs`
# walks every in-repository `path` field, asserts each file exists on
# disk, and re-computes its SHA-256 against the value recorded here.
# External archive entries keep their pinned hash but are not required
# to be present in this crate checkout. Any in-repository drift fails
# the build before commit.
#
# Cross-references:
# - PRIOR_ART_MAP.md         — 17 disclosed architecture elements
# - CLAIM_BOUNDARY_MATRIX.md — disclosed vs not-claimed
# - TIMESTAMP_RECEIPT.md     — public-accessibility receipt
# - CITATION.cff             — citation metadata
# - codemeta.json            — CodeMeta JSON-LD
# - .zenodo.json             — Zenodo deposit metadata for the v1.0
#                              deposit at DOI 10.5281/zenodo.20338027
#                              (sealed 2026-05-22)
# - sbom.spdx.json           — SPDX SBOM
#
# Disclaimer: This manifest is not legal advice. It records the
# SHA-256 fingerprints of the artifacts in this repository at PA.1
# seal so future verifiers can prove byte-identity against the sealed
# state.

[manifest]
schema_version = "v1"
sealed_at_commit = "2281cc8"
