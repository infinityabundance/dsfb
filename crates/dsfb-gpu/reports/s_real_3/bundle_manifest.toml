# --- Honest non-claims (apply to every dataset in this bundle) ---
[non_claims]
ground_truth = "DSFB does not assert which admitted episodes correspond to real-world anomalies, faults, defects, or causal events."
detector_superiority = "DSFB does not claim its admitted-episode count is better or worse than any other anomaly-detection method's. The numbers are structural-residual evidence, not a benchmark verdict."
remaining_useful_life = "For F4 datasets (NASA C-MAPSS), DSFB does not predict remaining useful life. It interprets structural residual evidence."
bug_severity = "For F5 datasets (Defects4J / BugsInPy / PROMISE), DSFB does not classify bug severity or predict defect density. Patch line count and CK metrics are projection inputs, not domain claims."
commercial_redistribution = "Datasets marked `no-upstream-license` are admitted under academic research-use convention; no commercial redistribution right is asserted."
cross_toolchain_replay = "Byte-identical replay is asserted only for the toolchain recorded in run_receipt.txt; cross-driver / cross-CUDA / cross-hardware byte-identity is NOT claimed."
