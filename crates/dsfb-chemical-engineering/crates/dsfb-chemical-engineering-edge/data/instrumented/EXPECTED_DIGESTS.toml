# Canonical witness-trace SHA-256 digests for the balance demonstrators (P47).
#
# Produced and checked by `scripts/verify_reproducibility.py`. Each digest is over a platform-portable
# canonical form of the witness trace (per row: `time_index:round(balance_residual*1e6):grammar_state`,
# signed zero normalised), so it is independent of last-ULP float text formatting across compilers.
#
# Purpose: let a third party byte-confirm that their run reproduces the paper's balance-witness results
# WITHOUT redistributing any data — only these hashes are committed.
#   * SYNTHETIC demonstrators (three_tank, quadruple_tank, cstr, csth) are openly shareable: anyone can
#     regenerate the input with `scripts/gen_instrumented.py` and must reproduce the digest.
#   * GATED demonstrators (swat_t101, batadal_t1) require the iTrust/benchmark bytes prepped locally via
#     `scripts/prep_{swat,batadal}.py`; the input CSVs are gitignored, so only a holder of the licensed
#     data can verify these (the verifier SKIPs them otherwise). Committing the digest — not the data —
#     is what makes the gated result independently checkable.
#
# Re-freeze deliberately (rerun with --mint) if the balance math, the demonstrator generators, or the
# prep recipes change.

