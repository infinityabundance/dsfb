# Frozen Chemical Court Record digests for all 20 committed public datasets (P50).
#
# Produced + checked by scripts/verify_reproducibility.py (--bundles). The casefile bundle is a
# pure function of the analysis (no timestamps, no paths — see the court_record module doc), so
# on the pinned toolchain each root is a stable constant. This extends the byte-verifiable
# surface from the balance witnesses (EXPECTED_DIGESTS.toml) to the ENTIRE operator artifact:
# anyone holding the committed data/slices/*.csv can `demo` (or `casefile <name>`) and confirm
# every dataset's bundle_root + evidence_root byte-for-byte. All 20 are openly reproducible
# (no gated data: dataset 20 is the synthetic SWaT stand-in). Re-freeze deliberately (--mint-bundles)
# if the pipeline, the Court Record format, or a committed slice changes.
#
# GOVERNED RE-FREEZE (Wave-1 A1, 2026-05-25): the PCA/standardisation degeneracy guard (data.rs Baseline::fit
# — a baseline-constant channel now falls back to raw deviation instead of dividing by a ~1e-12 std) changed
# exactly the two datasets with dead baseline sensor channels: cstr_reactor (Tc/q/label constant) and
# secom_semiconductor (stuck sensor columns). Their roots are re-minted below; the other 18 are byte-identical
# (verify-replay 6/6 + all golden gates unaffected). This removes the CSTR SPE/Q ~1.4e35 explosion artifact.
#
# GOVERNED RE-FREEZE (Wave-1 A3, 2026-05-25): operator_report.html gained a top claim-boundary banner +
# claim-strength legend. The HTML is one of the ten hashed CONTENT_FILES, so ALL 20 bundle_root values
# shifted; the evidence_root / replay_hash did NOT (court-record fields are not in canonical_replay_hash —
# verify-replay 6/6 intact). All 20 bundle_roots below are re-minted; all 20 evidence_roots are unchanged.
#
# GOVERNED RE-FREEZE (P83 universal operator legend, 2026-05-26): operator_report.html gained the universal
# claim legend (claim tier · witness-strength ladder · evidence kind · unknown route) + a per-episode
# witness-strength column. The HTML is one of the hashed CONTENT_FILES, so ALL 20 bundle_root values shifted
# again; all 20 evidence_root values are UNCHANGED (court fields are not in canonical_replay_hash —
# verify-replay 6/6 intact). Verified invariant by the regen (every evidence_root byte-identical).

#
# GOVERNED RE-FREEZE (P85 per-episode EvidenceKind column, 2026-05-27): operator_report.html gained a typed
# per-episode 'Evidence kind' column (derived from the witness rung via EvidenceKind::from_witness_strength).
# The HTML is one of the hashed CONTENT_FILES, so ALL 20 bundle_root values shifted again; all 20 evidence_root
# values are UNCHANGED (court fields are not in canonical_replay_hash — verify-replay 6/6 intact; asserted by
# the regen below).
#
# GOVERNED RE-FREEZE + CORRECTION (linalg degeneracy guard, A1 commit 4129adb, 2026-05-28): A1 raised the
# z-scoring std + PCA score-variance floors 1e-12 -> 1e-8 to cap the ~1e35 SPE blow-up on baseline-constant
# channels. A1 was MIS-REPORTED as hash-neutral: its bundle check read a stale `demo` output dir and missed
# that the guard, working as designed, genuinely changed TWO datasets with low-variance baseline channels —
# cstr_reactor (evidence_root 7432109527b4 -> f4349535b85c, AND its bundle_root; the floor binds on its
# constant Tc/q channels) and three_tank (bundle_root only — a z-score-dependent CONTENT_FILE,
# contribution_traces, changed; its evidence_root is byte-UNCHANGED). The other 18 datasets are byte-identical.
# This re-freeze corrects the two stale entries to the current (guarded, deterministic) values; confirmed by
# reverting the floor to 1e-12, which restores 7432109527b4 exactly. Lesson: ALWAYS `demo` immediately before
# the `--bundles` check (the script reads the newest existing demo dir).
#
# GOVERNED RE-FREEZE (P102 per-episode ClaimStrength + EvidenceAnchor columns, 2026-05-28): operator_report.html
# gained two per-episode columns — the claim-strength tier (derived from the episode's evidence kind via the
# single source of truth) and an evidence-anchor digest (a per-episode content hash, so each row is citable). The
# HTML is one of the ten hashed CONTENT_FILES, so ALL 20 bundle_root values shifted again; all 20 evidence_root
# values are byte-UNCHANGED (court fields are not in canonical_replay_hash — verify-replay 6/6; asserted by the
# regen: 20/20 evidence_roots identical). All 20 bundle_roots below are the post-P102 values.
# GOVERNED RE-FREEZE (panel B6-v1, evidence_kind in claim-audit CSV, 2026-05-28): admitted_episodes.csv gained a
# per-episode "evidence_kind" column (EvidenceKind::from_witness_strength, identical to the casefile.json
# EpisodeBadge) so the chemical evidence hierarchy is visible in the claim-audit table. admitted_episodes.csv is
# one of the ten hashed CONTENT_FILES, so ALL 20 bundle_root values shifted; every evidence_root / replay_hash is
# UNCHANGED (court-record fields are not in canonical_replay_hash — verify-replay 6/6). All 20 bundle_roots re-minted.
#
