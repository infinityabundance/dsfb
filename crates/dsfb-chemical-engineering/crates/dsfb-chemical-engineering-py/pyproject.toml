[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "dsfb-chemical-engineering"
version = "0.1.0"
description = "Python bindings for the DSFB-Chemical-Engineering read-only residual-semiotics courts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
]

[tool.maturin]
# abi3 wheel: one build runs on CPython 3.9+.
features = ["pyo3/extension-module"]
