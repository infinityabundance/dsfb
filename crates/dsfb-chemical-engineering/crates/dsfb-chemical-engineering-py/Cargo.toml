# Python bindings (pyo3 / maturin) for the DSFB-Chemical-Engineering edge crate. Standalone workspace
# (excluded from the host build); the wheel is built + published by the user with maturin (USER-ONLY).
[workspace]

[package]
name = "dsfb-chemical-engineering-py"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "dsfb_chemical_engineering"
crate-type = ["cdylib"]

[dependencies]
dsfb-chemical-engineering-edge = { path = "../dsfb-chemical-engineering-edge" }
# abi3-py39: one wheel works on CPython 3.9+ (forward-compatible). extension-module: don't link libpython.
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
