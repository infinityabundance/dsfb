# breadth_surface.toml — the DSFB-Chemical-Engineering navigation index.
#
# A top-level, machine-readable map of every major verifiable claim -> its governing artifact -> the exact
# command that reproduces it -> its evidence tier. This turns the project's deliberately-broad prior-art
# surface into ORGANIZED density: scan a claim, read its tier, run one command, get its sealed artifact.
#
# It asserts NO new capability — it indexes what the courts / tests / manifests already prove. It is kept
# honest by tests/breadth_surface_court.rs (every tier resolves to a real ClaimStrength; every CLI
# reproduction names a real `dsfb-chem-edge` subcommand; every governing artifact exists on disk or is a
# known frozen-hash name; the category counts equal what atlas::validate() + the committed manifests report)
# and hash-sealed (canonical_hash pinned in that court). Breadth only ever widens — adding a claim is a
# single, reviewable, governed re-freeze. STRICTLY chemical-engineering; no domain-generality claim.
#
# tier  ∈ { SealedFact (Tier 1) | EvidenceInterpretation (Tier 2) | SpeculativeImplication (Tier 3) | NonClaim }
# artifact_kind  ∈ { file | test | manifest | figure_manifest | script | frozen_hash }
# reproduce_kind ∈ { cli_subcommand | cargo_test | script | external }

schema = "breadth_surface_v1"

[expected_counts]
executed_detectors        = 18   # vs atlas::validate().n_executed
executed_fault_signatures = 7    # vs atlas::validate().n_fault_signatures_executed
fault_signatures          = 12   # vs atlas::validate().n_fault_signatures (total bank)
heuristics                = 6    # vs atlas::validate().n_heuristics
datasets                  = 20   # vs [[dataset]] count in data/MANIFEST.toml
golden_replays            = 6    # vs the GOLDEN synthetic-replay set in tests/golden_replay.rs
balance_witnesses         = 6    # vs entries in data/instrumented/EXPECTED_DIGESTS.toml
figures                   = 0    # vs n_figures in paper/figures/figure_manifest.json

# ── determinism / replay ──────────────────────────────────────────────────────────────────────────────
[[claim]]
id = "DET-REPLAY-01"
category = "determinism_replay"
statement = "Each synthetic dataset reproduces a byte-frozen canonical replay hash (6/6 deterministic)."
tier = "SealedFact"
governing_artifact = "crates/dsfb-chemical-engineering-edge/tests/golden_replay.rs"
artifact_kind = "test"
reproduce = "dsfb-chem-edge verify-replay"
reproduce_kind = "cli_subcommand"
non_claim_boundary = "byte-identity is pinned on the maintainer's toolchain; cross-architecture bit-identity is not claimed beyond it"

[[claim]]
id = "DET-REPLAY-02"
category = "determinism_replay"
statement = "All 20 Court Record bundle roots are byte-reproducible from the committed data/slices."
tier = "SealedFact"
governing_artifact = "crates/dsfb-chemical-engineering-edge/data/EXPECTED_BUNDLE_ROOTS.toml"
artifact_kind = "manifest"
reproduce = "crates/dsfb-chemical-engineering-edge/scripts/verify_reproducibility.py --bundles"
reproduce_kind = "script"

